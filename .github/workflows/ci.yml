name: CI

# Text (*.md) and the license change nothing CI checks, except spec/README.md:
# a chain test reads the specification's revision from it. (In `paths`, a
# later pattern overrides an earlier one.)
on:
  push:
    branches: [main]
    paths: ["**", "!**.md", "!LICENSE", "spec/README.md"]
  pull_request:
    paths: ["**", "!**.md", "!LICENSE", "spec/README.md"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The independent verifier's Python (.github/scripts/install-linux-tools.sh).
  # Named here, its test fails, rather than being skipped, if it is missing.
  KANHE_PYTHON: /opt/python-verifier/bin/python

jobs:
  # Which parts the change touches (.github/scripts/changed-parts.sh): a
  # change to the chain runs everything; one to the language skips
  # ThreadSanitizer, unless it touches the front end the console links; one
  # to an application alone runs only the applications' tests, and not the
  # Bo compiler's sanitizers.
  changes:
    name: Changed parts
    runs-on: ubuntu-latest
    outputs:
      chain: ${{ steps.parts.outputs.chain }}
      bo: ${{ steps.parts.outputs.bo }}
      apps: ${{ steps.parts.outputs.apps }}
      tsan: ${{ steps.parts.outputs.tsan }}
      tests: ${{ steps.parts.outputs.tests }}
      tsan_tests: ${{ steps.parts.outputs.tsan_tests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: parts
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash .github/scripts/changed-parts.sh "$BASE" | tee -a "$GITHUB_OUTPUT"

  # The test suites run one test at a time (the end-to-end tests start
  # servers), so each compiler gets its own job, and the limits leave room
  # for the hosted runners' four cores.
  linux:
    name: Linux (GCC 16)
    needs: changes
    runs-on: ubuntu-latest
    # Debian trixie: OpenSSL 3.5, CMake 3.31.
    container: gcc:16-trixie
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install tools
        run: .github/scripts/install-linux-tools.sh

      - name: GCC 16
        env:
          TESTS: ${{ needs.changes.outputs.tests }}
        run: |
          cmake --preset gcc-debug -DCMAKE_CXX_COMPILER=g++
          cmake --build --preset gcc-debug
          ctest --preset gcc-debug $TESTS

      # An open network's witness (spec v0.13): litewitness, the implementation
      # witness networks run, cosigns the ledger's checkpoint notes.
      - name: Go, for litewitness
        if: needs.changes.outputs.chain == 'true'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.27.x"
          cache: false

      - name: Interop with litewitness (filippo.io/torchwood)
        if: needs.changes.outputs.chain == 'true'
        run: |
          go install filippo.io/torchwood/cmd/litewitness@v0.10.0 filippo.io/torchwood/cmd/witnessctl@v0.10.0
          LITEWITNESS="$(go env GOPATH)/bin/litewitness" WITNESSCTL="$(go env GOPATH)/bin/witnessctl" \
              bash tests/interop/litewitness.sh build/gcc-debug/bin/kanhe

      - name: GCC 16 release (as the Docker image builds it, with the Bo compiler)
        run: |
          cmake --preset gcc-release -DCMAKE_CXX_COMPILER=g++ -DKANHE_BUILD_TESTS=OFF \
              -DCMAKE_EXE_LINKER_FLAGS="-static-libstdc++ -static-libgcc"
          cmake --build --preset gcc-release --target kanhe bo kanhe-console kanhe-index
          for p in kanhe bo kanhe-console kanhe-index; do build/gcc-release/bin/$p version; done
          build/gcc-release/bin/bo packs list

  address-sanitizer:
    name: Linux (Clang 23 with sanitizers)
    needs: changes
    runs-on: ubuntu-latest
    container: gcc:16-trixie
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install tools
        run: .github/scripts/install-linux-tools.sh

      # Clang has no C++26 reflection or contracts yet: it builds everything
      # but the Bo compiler proper, its front end included.
      - name: Clang 23 with AddressSanitizer and UndefinedBehaviorSanitizer
        env:
          TESTS: ${{ needs.changes.outputs.tests }}
        run: |
          cmake --preset clang-asan -DCMAKE_CXX_COMPILER=clang++-23
          cmake --build --preset clang-asan
          ctest --preset clang-asan $TESTS

      - name: Formatting
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git ls-files '*.cpp' '*.hpp' | xargs clang-format-23 --dry-run --Werror
          git ls-files '*.sh' | xargs python3 tools/check-scripts.py

  bo-sanitizers:
    # The Bo compiler is C++26 with reflection and contracts, which only GCC
    # builds: its sanitizer run is GCC's. It builds the Bo tests alone.
    name: Linux (GCC 16 with sanitizers, the Bo compiler)
    needs: changes
    if: needs.changes.outputs.chain == 'true' || needs.changes.outputs.bo == 'true'
    runs-on: ubuntu-latest
    container: gcc:16-trixie
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install tools
        run: .github/scripts/install-linux-tools.sh

      - name: GCC 16 with AddressSanitizer and UndefinedBehaviorSanitizer
        run: |
          cmake --preset gcc-asan -DCMAKE_CXX_COMPILER=g++
          cmake --build --preset gcc-asan
          ctest --preset gcc-asan

  thread-sanitizer:
    name: Linux (Clang 23 with ThreadSanitizer)
    needs: changes
    if: needs.changes.outputs.tsan == 'true'
    runs-on: ubuntu-latest
    # ThreadSanitizer needs a memory layout that the hosts' address
    # randomization can break (Ubuntu 26.04 runners); it then runs itself
    # again without randomization, a call Docker's default seccomp profile
    # refuses inside the container.
    container:
      image: gcc:16-trixie
      options: --security-opt seccomp=unconfined
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install tools
        run: .github/scripts/install-linux-tools.sh

      - name: Clang 23 with ThreadSanitizer
        env:
          TESTS: ${{ needs.changes.outputs.tsan_tests }}
        run: |
          cmake --preset clang-tsan -DCMAKE_CXX_COMPILER=clang++-23
          cmake --build --preset clang-tsan
          ctest --preset clang-tsan $TESTS

  # The verifier's page and the console, in a browser: on every change.
  browser-verifier:
    name: In the browser (the verifier and the console)
    runs-on: ubuntu-latest
    container: gcc:16-trixie
    timeout-minutes: 50
    defaults:
      run:
        # emsdk_env.sh finds its own directory only when sourced from bash.
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install tools
        run: |
          .github/scripts/install-linux-tools.sh
          .github/scripts/install-emscripten.sh

      # The WebAssembly first: the console's program embeds its checks.
      - name: Build the WebAssembly verifier and the console's checks, then the programs
        run: |
          (. /opt/emsdk/emsdk_env.sh && tools/wasm/build.sh build/wasm)
          cmake --preset gcc-debug -DCMAKE_CXX_COMPILER=g++ -DKANHE_BUILD_TESTS=OFF \
              -DKANHE_CONSOLE_WASM_DIR="$PWD/build/wasm"
          cmake --build --preset gcc-debug --target kanhe bo kanhe-console kanhe-index

      - name: Test in Node.js and Chromium
        run: |
          . /opt/emsdk/emsdk_env.sh
          cd tests/browser
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          cd ../..
          REQUIRE_BROWSER=1 tests/browser/run.sh build/gcc-debug/bin/kanhe build/wasm

      - name: Keep the verifier page
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kanhe-verify
          path: build/wasm/kanhe-verify.html
